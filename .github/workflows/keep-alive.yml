name: Keep Alive

on:
  # schedule 已移除，改用 UptimeRobot
  workflow_dispatch: # 保留手動觸發供測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl -sf https://dashai-api.onrender.com/health \
            -o /dev/null -w "status=%{http_code} time=%{time_total}s\n"
